name: Bug report
description: Create a report to help us fix a problem
title: "[BUG] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Briefly explain what happens and what the impact is.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See the error
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: What should happen under normal conditions.
    validations:
      required: true
  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior
      description: What exactly happens now (include error messages or logs, if any).
    validations:
      required: true
  - type: input
    id: os-device
    attributes:
      label: OS / Device
      placeholder: "e.g. macOS 15, Windows 11, iOS 18"
    validations:
      required: true
  - type: input
    id: browser-version
    attributes:
      label: Browser / Version
      placeholder: "e.g. Chrome 131, version 1.4.2"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, links, or any other details.
    validations:
      required: false
